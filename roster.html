<!doctype html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gridiron Guide - Roster</title>
	<link href="https://fonts.googleapis.com/css?family=Martel+Sans:400,900" rel="stylesheet">
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/main.css">
</head>

<body>
	<div class="outer-wrapper">
		<header class="site-header">
			<div class="brand">
				<h1>Gridiron Guide</h1>
				<p>All the NFL positions and the athletes who dominate them.</p>
			</div>
			<nav class="main-nav">
				<a href="index.html">Home</a>
				<a href="roster.html">Roster</a>
				<a href="about.html">About</a>
			</nav>
		</header>

		<main>
			<section class="page-section roster-section">
				<div class="section-header">
					<h2>NFL Position Roster</h2>
					<p>Filter positions by offense, defense, or special teams, then click a card to discover the greatest player at each role.</p>
					<div class="controls">
						<select id="position-filter">
							<option value="">All Positions</option>
							<option value="Offense">Offense</option>
							<option value="Defense">Defense</option>
							<option value="Special Teams">Special Teams</option>
						</select>
					</div>
				</div>
				<div class="cards-container" id="cards-container">
					<!-- Cards will be generated here -->
				</div>
			</section>
		</main>
	</div>

	<!-- GOAT Modal -->
	<div id="goat-modal" class="modal">
		<div class="modal-overlay"></div>
		<div class="modal-container">
			<button class="modal-close" onclick="closeGoatModal()">&times;</button>
			<div class="modal-body">
				<!-- Content generated by JavaScript -->
			</div>
		</div>
	</div>

	<script src="js/state-data.js"></script>
	<script src="js/script.js"></script>
</body>

</html>
